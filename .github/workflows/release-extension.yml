name: Release Chrome Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Chrome Extension
        run: npm run build:extension

      - name: Package extension into ZIP
        run: |
          # dist-extension 直下のファイル・フォルダ（README.md含む）をZIP化
          cd dist-extension
          zip -r ../ruri-webgpu-chrome-extension.zip .
          cd ..
          ls -lh ruri-webgpu-chrome-extension.zip

      - name: Generate SHA-256 Checksum
        run: |
          sha256sum ruri-webgpu-chrome-extension.zip > ruri-webgpu-chrome-extension.zip.sha256
          echo "SHA-256:"
          cat ruri-webgpu-chrome-extension.zip.sha256

      - name: Upload Extension Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ruri-webgpu-chrome-extension
          path: |
            ruri-webgpu-chrome-extension.zip
            ruri-webgpu-chrome-extension.zip.sha256
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ruri-webgpu-chrome-extension.zip
            ruri-webgpu-chrome-extension.zip.sha256
          generate_release_notes: true
          draft: false
          prerelease: false
