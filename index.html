<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Cross-Origin Isolation (WebGPU / SharedArrayBuffer 必須) -->
    <script src="/coi-serviceworker.js"></script>

    <!-- ONNX Runtime Web (CDNからスタンドアローン版をロードしWorkerバンドル混線を防止) -->
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.21.0/dist/ort.all.min.js"></script>

    <title>ruri-webgpu — ruri-v3-30m-liteの WebGPU 日本語セマンティック検索デモ</title>
    <meta name="description" content="Hugging Face Hub 直結・ブラウザ内 WebGPU 推論による完全クライアントサイド日本語セマンティック検索デモ" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Google Fonts: Inter & Noto Sans JP -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="container">
      <header style="margin-bottom: 2rem; display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 1rem;">
        <div>
          <h1 style="margin: 0 0 0.5rem 0; font-size: 1.8rem; letter-spacing: -0.02em;">
            <span style="background: linear-gradient(135deg, #a78bfa, #60a5fa); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;">ruri-webgpu</span>
          </h1>
          <p style="margin: 0; color: var(--text-muted); font-size: 0.95rem;">
            ruri-v3-30m-liteの WebGPU 日本語セマンティック検索デモ
          </p>
        </div>
        <div>
          <span id="device-badge" class="status-badge mode-wasm">検出中...</span>
        </div>
      </header>

      <main>
        <!-- 初期化・ダウンロード進捗表示コンテナ -->
        <div id="progress-container" class="glass-panel progress-container"></div>

        <!-- 検索UIコンテナ (初期化後に活性化) -->
        <div id="search-section" class="hidden">
          <div class="search-container">
            <input
              id="search-input"
              type="text"
              class="search-input"
              placeholder="意味で検索（例: 「日本の首都」「宇宙の成り立ち」「AIと機械学習」）..."
              autocomplete="off"
            />
          </div>

          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; font-size: 0.85rem; color: var(--text-muted); flex-wrap: wrap; gap: 0.5rem;">
            <div style="display: flex; align-items: center; gap: 0.75rem;">
              <span id="corpus-stats">インデックス文書数: 0 件</span>
              <button id="corpus-toggle-btn" class="corpus-toggle-btn" type="button">
                <span>📖 収録文書一覧を見る</span>
              </button>
            </div>
            <span id="search-latency"></span>
          </div>

          <!-- 収録文書一覧アコーディオン (初期は非表示) -->
          <div id="corpus-panel" class="corpus-panel hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem;">
              <h3 style="margin: 0; font-size: 1rem; color: #ffffff;">収録文書一覧（カードクリックで検索を試せます）</h3>
            </div>
            <div id="corpus-filters" class="corpus-filter-bar"></div>
            <div id="corpus-grid" class="corpus-grid"></div>
          </div>

          <div id="search-spinner" class="spinner hidden"></div>

          <div id="empty-state" class="empty-state hidden">
            <p>一致する検索結果が見つかりませんでした。</p>
          </div>

          <div id="search-results" class="search-results"></div>
        </div>
      </main>

      <footer style="margin-top: 3rem; text-align: center; font-size: 0.85rem; color: var(--text-muted); border-top: 1px solid var(--glass-border); padding-top: 1.5rem;">
        <p>
          Powered by <a href="https://huggingface.co/Chottokun/ruri-v3-30m-lite" target="_blank" rel="noopener" style="color: #a78bfa; text-decoration: none;">Chottokun/ruri-v3-30m-lite</a> & 
          <a href="https://onnxruntime.ai/" target="_blank" rel="noopener" style="color: #60a5fa; text-decoration: none;">ONNX Runtime Web</a> (WebGPU / WASM)
        </p>
      </footer>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
